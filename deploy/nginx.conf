server {
    listen 80;
    listen [::]:80;
    server_name inakkam.co www.inakkam.co;

    # Redirect all HTTP requests to HTTPS for security
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name inakkam.co www.inakkam.co;

    # SSL Certificate Paths (adjust these if yours are different, e.g. Let's Encrypt paths)
    ssl_certificate /etc/letsencrypt/live/inakkam.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inakkam.co/privkey.pem;

    # Root directory of your frontend build (dist folder)
    root /var/www/inakkam/dist; 
    index index.html;

    client_max_body_size 50M;

    # 1. Serve frontend static assets & SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse proxy API requests to Node.js backend
    location /api {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Reverse proxy uploads directory to Node.js backend
    location /uploads {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Reverse proxy Socket.io (WebSocket support)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
